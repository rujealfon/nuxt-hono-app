# Local data: Postgres, Redis, Drizzle Studio.
# API, app, admin, and web run on the host (`pnpm dev`).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuxt_app_postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuxt_app_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_app_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-nuxt_app_postgres_user} -d ${POSTGRES_DB:-nuxt_app_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: docker/Dockerfile.drizzle-studio
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuxt_app_postgres_user}:${POSTGRES_PASSWORD:-nuxt_app_postgres_password}@postgres:5432/${POSTGRES_DB:-nuxt_app_db}
    ports:
      - '127.0.0.1:4983:4983'
    volumes:
      - ./apps/api/src/db:/repo/apps/api/src/db
      - ./apps/api/drizzle.config.ts:/repo/apps/api/drizzle.config.ts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
