services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuxt_app_postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuxt_app_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_app_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-nuxt_app_postgres_user} -d ${POSTGRES_DB:-nuxt_app_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: pnpm --filter @nuxt-app/api dev
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./packages/types/src:/repo/packages/types/src
      - ./packages/env/src:/repo/packages/env/src
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      API_PORT: 3001
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nuxt_app_postgres_user}:${POSTGRES_PASSWORD:-nuxt_app_postgres_password}@postgres:5432/${POSTGRES_DB:-nuxt_app_db}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3002}
      WEB_URL: ${WEB_URL:-http://localhost:3003}
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

      interval: 10s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    command: pnpm --filter @nuxt-app/api exec drizzle-kit studio --host 0.0.0.0 --port 4983
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuxt_app_postgres_user}:${POSTGRES_PASSWORD:-nuxt_app_postgres_password}@postgres:5432/${POSTGRES_DB:-nuxt_app_db}
    ports:
      - '127.0.0.1:4983:4983'
    volumes:
      - ./apps/api/src/db:/repo/apps/api/src/db
      - ./apps/api/drizzle.config.ts:/repo/apps/api/drizzle.config.ts
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.nuxt
      target: development
      args:
        PACKAGE: '@nuxt-app/app'
        APP_DIR: apps/app
    command: pnpm --filter @nuxt-app/app exec nuxt dev --port 3000 --host 0.0.0.0
    volumes:
      - ./apps/app/app:/repo/apps/app/app
      - ./apps/app/nuxt.config.ts:/repo/apps/app/nuxt.config.ts
      - ./layers/base/app:/repo/layers/base/app
      - ./layers/base/nuxt.config.ts:/repo/layers/base/nuxt.config.ts
      - ./layers/base/load-root-env.ts:/repo/layers/base/load-root-env.ts
      - ./layers/auth/app:/repo/layers/auth/app
      - ./layers/auth/nuxt.config.ts:/repo/layers/auth/nuxt.config.ts
      - ./layers/auth/colada.options.ts:/repo/layers/auth/colada.options.ts
      - ./layers/auth/server:/repo/layers/auth/server
      - ./packages/types/src:/repo/packages/types/src
      - ./packages/auth/src:/repo/packages/auth/src
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.nuxt
      target: development
      args:
        PACKAGE: '@nuxt-app/admin'
        APP_DIR: apps/admin
    command: pnpm --filter @nuxt-app/admin exec nuxt dev --port 3002 --host 0.0.0.0
    volumes:
      - ./apps/admin/app:/repo/apps/admin/app
      - ./apps/admin/nuxt.config.ts:/repo/apps/admin/nuxt.config.ts
      - ./layers/base/app:/repo/layers/base/app
      - ./layers/base/nuxt.config.ts:/repo/layers/base/nuxt.config.ts
      - ./layers/base/load-root-env.ts:/repo/layers/base/load-root-env.ts
      - ./layers/auth/app:/repo/layers/auth/app
      - ./layers/auth/nuxt.config.ts:/repo/layers/auth/nuxt.config.ts
      - ./layers/auth/colada.options.ts:/repo/layers/auth/colada.options.ts
      - ./layers/auth/server:/repo/layers/auth/server
      - ./packages/types/src:/repo/packages/types/src
      - ./packages/auth/src:/repo/packages/auth/src
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.nuxt
      target: development
      args:
        PACKAGE: '@nuxt-app/web'
        APP_DIR: apps/web
    command: pnpm --filter @nuxt-app/web exec nuxt dev --port 3003 --host 0.0.0.0
    volumes:
      - ./apps/web/app:/repo/apps/web/app
      - ./apps/web/nuxt.config.ts:/repo/apps/web/nuxt.config.ts
      - ./layers/base/app:/repo/layers/base/app
      - ./layers/base/nuxt.config.ts:/repo/layers/base/nuxt.config.ts
      - ./layers/base/load-root-env.ts:/repo/layers/base/load-root-env.ts
      - ./packages/types/src:/repo/packages/types/src
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-http://localhost:3000}

volumes:
  postgres_data:
