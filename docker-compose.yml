# Local data only. API, app, admin, and web run on the host (`pnpm dev`).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuxt_app_postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuxt_app_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_app_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-nuxt_app_postgres_user} -d ${POSTGRES_DB:-nuxt_app_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
